<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaha POS — UI/UX prototype (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#DDE3DB; --bg:#EEF2EC; --surface:#FBFCF9; --raised:#FFFFFF;
  --ink:#16221D; --muted:#5A6962; --line:#CFD8CE; --line-soft:#E2E8E0;
  --brand:#0E5A47; --brand-2:#13755C; --brand-wash:#DCEBE4; --on-brand:#FFFFFF;
  --charge:#F2C94C; --charge-ink:#1E1A08; --charge-hover:#E9BB2E;
  --ok:#157F3B; --ok-wash:#DDF1E3; --warn:#9A4A06; --warn-wash:#FCEBD7;
  --danger:#B42318; --danger-wash:#FBE1DE; --info:#1D4F91; --info-wash:#E0EAF7;
  --receipt:#FFFEF8; --shadow:0 1px 2px rgba(22,34,29,.08),0 8px 24px rgba(22,34,29,.08);
  --r-s:8px; --r-m:12px; --r-l:18px;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#0C1311; --bg:#111A17; --surface:#16211D; --raised:#1C2925;
  --ink:#E6EEE9; --muted:#9AAAA2; --line:#2C3B35; --line-soft:#22302B;
  --brand:#3FB28E; --brand-2:#57C6A2; --brand-wash:#18352C; --on-brand:#06140F;
  --charge:#F2C94C; --charge-ink:#1E1A08; --charge-hover:#FFD966;
  --ok:#5BC77F; --ok-wash:#163222; --warn:#F0A55A; --warn-wash:#35260F;
  --danger:#F2867A; --danger-wash:#3A1B18; --info:#8DB6F0; --info-wash:#17263B;
  --receipt:#F6F3E6; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --stage:#0C1311; --bg:#111A17; --surface:#16211D; --raised:#1C2925;
  --ink:#E6EEE9; --muted:#9AAAA2; --line:#2C3B35; --line-soft:#22302B;
  --brand:#3FB28E; --brand-2:#57C6A2; --brand-wash:#18352C; --on-brand:#06140F;
  --ok:#5BC77F; --ok-wash:#163222; --warn:#F0A55A; --warn-wash:#35260F;
  --danger:#F2867A; --danger-wash:#3A1B18; --info:#8DB6F0; --info-wash:#17263B;
  --receipt:#F6F3E6; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--stage);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- stage + device frame ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px}
.stagebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.device{container-type:inline-size;container-name:app;background:var(--bg);border-radius:26px;box-shadow:0 0 0 10px #1a1f1d,0 30px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;max-width:100%}
.device.tablet{width:1194px;height:834px}
.device.phone{width:390px;height:844px;border-radius:40px}
.device.fit{width:100%;height:calc(100vh - 80px);border-radius:12px;box-shadow:none}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:58px 1fr;height:100%;position:relative}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;margin-right:6px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand);font-style:normal;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line-soft);font-size:13px;color:var(--muted);white-space:nowrap}
.chip strong{color:var(--ink);font-weight:600}
.chip.demo{background:var(--warn-wash);color:var(--warn);border-color:transparent;font-weight:600}
.spacer{flex:1}
.sync{border:0;cursor:pointer;font-weight:600}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.sync.online{background:var(--ok-wash);color:var(--ok)}
.sync.pending{background:var(--info-wash);color:var(--info)}
.sync.pending .dot{background:var(--info)}
.sync.offline{background:var(--warn-wash);color:var(--warn)}
.sync.offline .dot{background:var(--warn)}
.sync.error{background:var(--danger-wash);color:var(--danger)}
.sync.error .dot{background:var(--danger)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-wash);color:var(--brand);display:grid;place-items:center;font-weight:700}

.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px;overflow:auto}
.rail button{position:relative;border:0;background:none;border-radius:var(--r-m);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);min-height:58px}
.rail button svg{width:22px;height:22px}
.rail button[aria-current="page"]{background:var(--brand-wash);color:var(--brand);font-weight:600}
.rail button:disabled{opacity:.35;cursor:not-allowed}
.rail .rail-more{display:none}
.morelist{display:grid;gap:8px}
.morelist button{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--raised);font-weight:600;text-align:left}
.morelist button svg{width:22px;height:22px;color:var(--muted)}
.morelist button:disabled{opacity:.4}
.badge{position:absolute;top:6px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.main{overflow:hidden;position:relative;min-height:0}
.scroll{height:100%;overflow:auto;padding:20px 22px 28px}

/* pre-auth screens */
.gate{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;padding:24px;overflow:auto;background:
  radial-gradient(circle at 15% 10%,var(--brand-wash),transparent 45%),var(--bg)}
.gatecard{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:28px;box-shadow:var(--shadow)}
.gatecard h1{font-size:26px;letter-spacing:-.02em;margin:10px 0 4px;line-height:1.15}
.gatecard p.lead{color:var(--muted);margin:0 0 20px}
.steps{display:flex;gap:6px;margin-bottom:6px}
.steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--brand)}

/* form bits */
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.field{margin-bottom:14px}
.input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--raised);padding:0 14px;font-size:16px}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-wash)}
textarea.input{height:auto;padding:10px 14px;min-height:90px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--raised);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--danger);border-color:var(--danger-wash);background:var(--danger-wash)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:var(--r-s)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.choice{display:grid;gap:10px}
.choice button{display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:62px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--raised)}
.choice button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-wash)}
.choice small{display:block;color:var(--muted);font-size:12.5px}

/* ---------- checkout ---------- */
.checkout{display:grid;grid-template-columns:minmax(0,1fr) 372px;height:100%}
.catalog{display:flex;flex-direction:column;min-height:0;padding:16px 18px 0}
.searchrow{display:flex;gap:10px}
.search{position:relative;flex:1}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search .input{padding-left:44px;height:52px;font-size:16.5px}
.scanbtn{width:52px;height:52px;padding:0}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 0 10px;scrollbar-width:none}
.cats button{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--raised);font-weight:500}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.stale{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--warn);background:var(--warn-wash);padding:8px 12px;border-radius:var(--r-s);margin-bottom:10px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding-bottom:18px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line-soft);background:var(--raised);border-radius:var(--r-m);padding:12px;min-height:118px;display:flex;flex-direction:column;gap:4px;transition:transform .08s,border-color .15s}
.tile:hover{border-color:var(--brand)}
.tile:active{transform:scale(.97)}
.tile .swatch{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;margin-bottom:2px}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25}
.tile .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile .pr{font-weight:700;font-size:15px}
.tile .st{font-size:12px;color:var(--muted)}
.tile .st.low{color:var(--warn);font-weight:600}
.tile .st.out{color:var(--danger);font-weight:600}
.tile .incart{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--info-wash);color:var(--info)}
.tag.warn{background:var(--warn-wash);color:var(--warn)}
.tag.ok{background:var(--ok-wash);color:var(--ok)}
.tag.danger{background:var(--danger-wash);color:var(--danger)}
.tag.muted{background:var(--bg);color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted)}

.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.carthead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.carthead h2{margin:0;font-size:17px}
.lines{flex:1;overflow:auto;padding:4px 10px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 6px;border-bottom:1px solid var(--line-soft)}
.line .nm{font-weight:600;font-size:14px}
.line .sub{font-size:12.5px;color:var(--muted)}
.line .amt{font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--raised);font-size:20px;line-height:1;display:grid;place-items:center}
.qty output{min-width:38px;text-align:center;font-weight:700;font-size:16px}
.lineacts{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.cartempty{padding:40px 24px;text-align:center;color:var(--muted)}
.cartempty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.totals{padding:12px 16px 4px;border-top:1px solid var(--line);font-size:14px}
.totals .r{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted)}
.totals .r b{color:var(--ink);font-weight:600}
.cartacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 16px}
.charge{margin:6px 16px 16px;height:72px;border:0;border-radius:var(--r-l);background:var(--charge);color:var(--charge-ink);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:800;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.charge:hover{background:var(--charge-hover)}
.charge .big{font-size:28px;letter-spacing:-.02em}
.charge:disabled{opacity:.45;cursor:not-allowed}
.cartbar{display:none}

/* ---------- payment ---------- */
.pay{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.paymain{padding:18px 22px;overflow:auto}
.payside{background:var(--surface);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.due{background:var(--ink);color:var(--surface);border-radius:var(--r-l);padding:18px 20px}
.due small{opacity:.75;font-size:13px}
.due .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.methods button{min-height:74px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--raised);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.methods button small{font-weight:400;color:var(--muted);font-size:12px}
.methods button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-wash);color:var(--brand)}
.tenderbig{height:68px;font-size:30px;font-weight:700;text-align:right}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 16px}
.quick button{height:52px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--raised);font-weight:600}
.change{display:flex;justify-content:space-between;align-items:center;background:var(--ok-wash);color:var(--ok);border-radius:var(--r-m);padding:14px 16px;font-weight:700;font-size:18px;margin-bottom:14px}
.applied{display:flex;flex-direction:column;gap:6px}
.applied .p{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:var(--r-s);padding:8px 10px;font-size:13.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-m);background:var(--bg);margin-bottom:14px;font-size:14px}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brand)}

/* ---------- receipt ---------- */
.receiptwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
.paper{background:var(--receipt);color:#1b1b1b;width:min(330px,100%);margin:20px auto;padding:20px 18px;font-family:var(--mono);font-size:12px;line-height:1.5;box-shadow:var(--shadow);position:relative;border-radius:2px}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--receipt) 0),linear-gradient(45deg,transparent 6px,var(--receipt) 0);background-size:12px 8px}
.paper .c{text-align:center}
.paper .rr{display:flex;justify-content:space-between;gap:8px}
.paper hr{border:0;border-top:1px dashed #999;margin:8px 0}
.paper .stamp{border:2px solid #B42318;color:#B42318;text-align:center;font-weight:800;padding:6px;margin:10px 0;letter-spacing:.02em}
.paper .reprint{background:#1b1b1b;color:#fff;text-align:center;font-weight:800;padding:3px;margin-bottom:8px}
.status{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-m);font-size:14px}
.status svg{flex:none;width:22px;height:22px;margin-top:1px}
.status.ok{background:var(--ok-wash);color:var(--ok)}
.status.warn{background:var(--warn-wash);color:var(--warn)}
.status.danger{background:var(--danger-wash);color:var(--danger)}
.status.info{background:var(--info-wash);color:var(--info)}
.status b{display:block;font-size:15px}
.status p{margin:2px 0 0;color:var(--ink);opacity:.85}

/* ---------- generic page parts ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.ph p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
tr.sel td{background:var(--brand-wash)}
.tablewrap{overflow-x:auto}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.toggle:last-child{border-bottom:0}
.toggle small{display:block;color:var(--muted)}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--brand)}
.sw:checked::after{left:23px}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.denom{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--r-s);padding:6px 8px}
.denom span{width:56px;font-weight:600;font-size:14px}
.denom input{height:40px;font-size:15px;text-align:right}
.formula{font-size:14px}
.formula .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.formula .r.t{border:0;font-weight:800;font-size:17px;padding-top:9px}

/* modal + toast */
.scrim{position:absolute;inset:0;background:rgba(10,18,15,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:var(--r-l);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .18s}
.modal h3{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
.modal .lead{color:var(--muted);margin:0 0 16px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toasts{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;width:min(420px,90%)}
.toast{background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:var(--r-m);font-size:14px;box-shadow:var(--shadow);animation:pop .2s}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pinpad button{height:56px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--raised);font-size:20px;font-weight:600}
.pindots{display:flex;gap:12px;justify-content:center;margin:6px 0 4px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}

/* ---------- phone portrait ---------- */
@container app (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:54px 1fr 66px}
  .topbar{padding:0 10px;gap:6px}
  .topbar .hide-s{display:none}
  .logo span{display:none}
  .rail{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 6px;gap:2px;overflow-x:auto}
  .rail{overflow:hidden}
  .rail button{flex:1 1 0;min-width:0;min-height:56px;padding:6px 2px}
  .rail .rail-extra{display:none}
  .rail .rail-more{display:flex}
  .rail button span:not(.badge){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .badge{right:8px;top:2px}
  .checkout,.pay,.receiptwrap{grid-template-columns:minmax(0,1fr)}
  .catalog{padding:12px 12px 0}
  .grid{grid-template-columns:repeat(2,1fr);padding-bottom:84px}
  .cart{position:absolute;inset:0;z-index:30;transform:translateY(100%);transition:transform .22s;border-left:0}
  .cart.open{transform:none}
  .cartbar{display:flex;position:absolute;left:10px;right:10px;bottom:10px;z-index:20;height:62px;border:0;border-radius:var(--r-l);background:var(--charge);color:var(--charge-ink);align-items:center;justify-content:space-between;padding:0 18px;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
  .payside{border-left:0;border-top:1px solid var(--line)}
  .pay,.receiptwrap{overflow:auto;height:100%;display:block}
  .methods{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:1fr}
  .scroll{padding:16px 14px 24px}
  .ph h1{font-size:22px}
  .due .big{font-size:34px}
  .hide-phone{display:none}
  .toasts{top:62px;bottom:auto}
}

/* ---------- installed app mode (Android shell) ---------- */
html.inapp, html.inapp body{height:100%;overflow:hidden;background:var(--surface)}
html.inapp .stagebar{display:none}
html.inapp .stage{padding:0;gap:0;height:100%;min-height:0}
html.inapp .device{width:100%;height:auto;flex:1;min-height:0;max-width:none;border-radius:0;box-shadow:none}
html.inapp .appbanner{display:block;align-self:stretch}
.appbanner{display:none;background:var(--warn-wash);color:var(--warn);font-size:12px;font-weight:600;text-align:center;padding:4px 8px}

/* ---------------- money helpers (integer centavos) ---------------- */
function peso(c){ const neg=c<0; c=Math.abs(c); return (neg?"−":"")+"₱"+Math.floor(c/100).toLocaleString("en-PH")+"."+String(c%100).padStart(2,"0"); }
function parsePeso(str){
  str=String(str??"").replace(/[₱,\s]/g,"");
  if(str===""||!/^\d*(\.\d{0,2})?$/.test(str)) return null;
  const [a,b=""]=str.split(".");
  return parseInt(a||"0",10)*100+parseInt((b+"00").slice(0,2),10);
}
// VAT inside a VAT-inclusive amount at 12%: round half up per line. Rule documented in ADR-002.
const vatOf = net => Math.floor((net*12+56)/112);

/* Cart math. Order discount is allocated by largest remainder, ties by line order — deterministic. */
function compute(lines, disc){
  const rows = lines.map((l,i)=>{ const p=prod(l.pid); return {i,pid:p.id,sku:p.sku,name:p.name,unit:p.unit,price:p.price,tax:p.tax,qty:l.qty,gross:p.price*l.qty}; });
  const G = rows.reduce((s,r)=>s+r.gross,0);
  let D = 0;
  if(disc && G>0) D = disc.type==="pct" ? Math.floor((G*disc.value+50)/100) : Math.min(disc.value,G);
  let used=0;
  rows.forEach(r=>{ r.alloc=G?Math.floor(D*r.gross/G):0; r.rem=G?(D*r.gross)%G:0; used+=r.alloc; });
  let left=D-used;
  [...rows].sort((a,b)=>b.rem-a.rem||a.i-b.i).forEach(r=>{ if(left>0){r.alloc++;left--;} });
  rows.forEach(r=>{ r.net=r.gross-r.alloc; r.vat=r.tax==="V"?vatOf(r.net):0; });
  const sum=f=>rows.reduce((s,r)=>s+f(r),0);
  const vat=sum(r=>r.vat);
  return { rows, gross:G, discount:D, payable:G-D, vat,
    vatable: sum(r=>r.tax==="V"?r.net:0)-vat, exempt: sum(r=>r.tax==="E"?r.net:0),
    items: sum(r=>r.qty) };
}

function enqueue(type, aggregate, payload){

}
/* Re-render without losing what the person is typing in an open dialog. */
function renderKeep(){
  const keep={}; $app.querySelectorAll(".modal input,.modal select,.modal textarea").forEach(i=>{ if(i.id) keep[i.id]=i.type==="checkbox"?i.checked:i.value; });
  const fid=document.activeElement&&document.activeElement.id;
  render();
  Object.entries(keep).forEach(([id,v])=>{const i=document.getElementById(id);if(i){if(i.type==="checkbox")i.checked=v;else i.value=v;}});
  if(fid){const i=document.getElementById(fid); if(i) i.focus({preventScroll:true});}
}

/* ---------------- render plumbing ---------------- */

function renderToasts(){ const el=document.getElementById("toasts"); if(el) el.innerHTML=ui.toasts.map(t=>`<div class="toast" role="status">${esc(t.msg)}</div>`).join(""); }

function render(){
  save();

  else if(!s.enrolled) html = gate(viewEnroll());
  else if(!s.branch) html = gate(viewBranch());
  else if(!S.shift && (S.view==="checkout"||S.view==="pay"||S.view==="receipt") && can("checkout")) html = shell(viewOpenShift());
  else html = shell(route());
  $app.innerHTML = html + `<div class="toasts" id="toasts"></div>` + (ui.modal?modalHtml(ui.modal):"");
  renderToasts();
  const af=$app.querySelector("[data-autofocus]"); if(af && !ui.modal) af.focus({preventScroll:true});

const gate = inner => `<div class="gate">${inner}</div>`;

function syncState(){
  const pending=S.outbox.filter(c=>c.status==="pending").length;
  const bad=S.outbox.filter(c=>c.status==="quarantined").length;
  if(!S.online) return {cls:"offline",txt: pending?`Offline, ${pending} waiting`:"Offline"};
  if(bad) return {cls:"error",txt:`${bad} need review`};
  if(pending) return {cls:"pending",txt:`Syncing ${pending}`};
  return {cls:"online",txt:"Online, all synced"};
}

function shell(inner){

  const nav=[

    ["settings","Settings",ICON.gear,true]
  ];
  const cur = S.view==="pay"||S.view==="receipt" ? "checkout" : S.view;
  return `

    <span class="spacer"></span>
    <button class="chip sync ${st.cls}" data-act="go" data-v="sync" aria-label="Sync status: ${st.txt}"><span class="dot"></span>${st.txt}</button>
    <div class="who"><span class="hide-s">${esc(s.user)}, ${ROLES[s.role].label}</span><span class="avatar">${esc(s.user[0])}</span></div>
  </header>
  <nav class="rail" aria-label="Main">
    ${nav.map(([v,l,ic,ok,b])=>`<button data-act="go" data-v="${v}" class="${["backoffice","sync","settings"].includes(v)?"rail-extra":""}" ${cur===v?'aria-current="page"':""} ${ok?"":"disabled title='Your role does not include this'"}>${ic}<span>${l}</span>${b?`<span class="badge">${b}</span>`:""}</button>`).join("")}
    <button data-act="more" class="rail-more" ${["backoffice","sync","settings"].includes(cur)?'aria-current="page"':""}>${ICON.more}<span>More</span>${S.outbox.filter(c=>c.status!=="acked").length?`<span class="badge">${S.outbox.filter(c=>c.status!=="acked").length}</span>`:""}</button>
  </nav>
  <main class="main" id="main">${inner}</main>`;
}

function route(){
  switch(S.view){
    case "checkout": return can("checkout")?viewCheckout():viewNoAccess("Checkout");
    case "pay": return viewPay();
    case "receipt": return viewReceipt();
    case "held": return viewHeld();
    case "sales": return viewSales();
    case "shift": return viewShift();
    case "backoffice": return can("backoffice")?viewBackoffice():viewNoAccess("Back office");
    case "sync": return viewSync();
    case "settings": return viewSettings();
  }
  return viewCheckout();
}

function addToCart(pid){
  const l=S.cart.lines.find(x=>x.pid===pid);
  if(l) l.qty++; else S.cart.lines.push({pid,qty:1});
  const st=S.stock[pid]??0, q=(l?l.qty:1);
  if(q>st) toast(`${prod(pid).name}: more than the ${st} on record. Allowed; flagged for review.`);
}

/* ================= PAYMENT ================= */
function payState(){
  const t=compute(S.cart.lines,S.cart.discount);
  if(!S.pay || S.pay.payable!==t.payable) S.pay={payable:t.payable,method:"cash",applied:[]};
  const appliedSum=S.pay.applied.reduce((s,p)=>s+p.amount,0);
  return {t, remaining:S.pay.payable-appliedSum, appliedSum};
}
function viewPay(){
  const {t,remaining}=payState(), m=S.pay.method;
  const tender=parsePeso(ui.tender);
  const quick=[remaining, ...[100,200,500,1000].map(x=>x*100).filter(v=>v>=remaining)].slice(0,4);
  let entry="";
  if(remaining<=0){
    entry=`<div class="status ok">${ICON.ok}<div><b>Fully paid</b><p>Applied payments match the amount due. Complete the sale to save it.</p></div></div>`;
  } else if(m==="cash"){
    const applied = tender==null?0:Math.min(tender,remaining);
    const change = tender==null?0:Math.max(0,tender-remaining);
    entry=`<label class="f" for="tender">Cash received</label>
      <input id="tender" class="input tenderbig num" inputmode="decimal" placeholder="0.00" value="${esc(ui.tender)}" data-autofocus>
      <div class="quick">${quick.map((v,i)=>`<button class="num" data-act="quick" data-v="${v}">${i===0?"Exact":peso(v).replace(".00","")}</button>`).join("")}</div>
      ${tender!=null&&tender>0?`<div class="change num"><span>${tender>=remaining?"Change":"Still due after this"}</span><span>${tender>=remaining?peso(change):peso(remaining-applied)}</span></div>`:""}
      <button class="btn primary block" data-act="applycash" ${tender?"":"disabled"}>Apply ${tender?peso(applied):"cash"}</button>`;

    entry=`<div class="status info">${ICON.q}<div><b>Recorded manually</b><p>Kaha does not talk to the ${m==="ewallet"?"e-wallet app":"card terminal"} yet. Confirm the payment there, then record its reference here.</p></div></div>
      <div class="field" style="margin-top:14px"><label class="f" for="amt">Amount</label><input id="amt" class="input num" inputmode="decimal" value="${(remaining/100).toFixed(2)}"></div>
      <div class="field"><label class="f" for="ref">${m==="ewallet"?"Reference number from the app":"Approval code from the terminal"}</label><input id="ref" class="input" value="${esc(ui.ref)}" placeholder="${m==="ewallet"?"e.g. 1029 384 756":"e.g. 004512"}" data-autofocus></div>

      <button class="btn primary block" data-act="applymanual">Record ${label.toLowerCase()} payment</button>`;

  return `<div class="pay">

      <div class="due"><small>${remaining<=0?"Nothing left to pay":S.pay.applied.length?"Still due":"Amount due"}</small><div class="big num">${peso(Math.max(0,remaining))}</div></div>
      ${remaining>0?`<div class="methods" role="group" aria-label="Payment method">
        <button data-act="method" data-v="cash" aria-pressed="${m==="cash"}">Cash<small>Count and give change</small></button>
        <button data-act="method" data-v="ewallet" aria-pressed="${m==="ewallet"}">E-wallet<small>Manual record</small></button>
        <button data-act="method" data-v="card" aria-pressed="${m==="card"}">Card<small>Manual record</small></button>
      </div>`:`<div style="height:14px"></div>`}
      ${entry}

      <h2 style="margin:0;font-size:16px">Summary</h2>
      <dl class="kv num"><dt>${t.items} items</dt><dd>${peso(t.gross)}</dd>${t.discount?`<dt>Discount</dt><dd>−${peso(t.discount)}</dd>`:""}<dt>Total</dt><dd>${peso(t.payable)}</dd></dl>
      <h2 style="margin:8px 0 0;font-size:16px">Payments applied</h2>
      <div class="applied">${S.pay.applied.length?S.pay.applied.map((p,i)=>`<div class="p num"><span>${p.method==="cash"?`Cash <small style="color:var(--muted)">received ${peso(p.tendered)}, change ${peso(p.change)}</small>`:`${p.method==="ewallet"?"E-wallet":"Card"} <small style="color:var(--muted)">ref ${esc(p.ref)}</small>`}</span><span>${peso(p.amount)} <button class="btn sm ghost" data-act="rmpay" data-v="${i}" aria-label="Remove payment">✕</button></span></div>`).join(""):`<span style="color:var(--muted);font-size:14px">None yet.</span>`}</div>
      <div class="spacer"></div>
      <button class="charge" style="margin:0" data-act="complete" ${remaining===0?"":"disabled"}><span>Complete sale</span><span class="big num">${peso(t.payable)}</span></button>

/* Atomic completion: everything below is written in one step, then saved, before success is shown. */
function completeSale(){
  const t=compute(S.cart.lines,S.cart.discount);
  const id=uuid(), now=Date.now();
  S.invoiceSeq++;
  const inv=`DEMO-${S.session.terminal}-${String(S.invoiceSeq).padStart(6,"0")}`;
  const sale={ id, ref:"S-"+short(id), invoice:inv, ts:now, bizDate:bizDate(now), shiftId:S.shift.id, cashier:S.session.user,
    branch:S.session.branch, terminal:S.session.terminal, state:"completed", sync:"pending",
    lines:t.rows.map(r=>({pid:r.pid,sku:r.sku,name:r.name,unit:r.unit,price:r.price,tax:r.tax,taxRate:r.tax==="V"?12:0,qty:r.qty,gross:r.gross,discount:r.alloc,net:r.net,vat:r.vat,returned:0,refunded:0})),
    totals:{gross:t.gross,discount:t.discount,payable:t.payable,vat:t.vat,vatable:t.vatable,exempt:t.exempt},
    discountInfo:S.cart.discount, payments:S.pay.applied.map(p=>({...p,id:uuid(),status:p.method==="cash"?"collected":"manually_verified",verifiedAt:now,cashier:S.session.user})),
    reprints:0, print:"not_sent" };
  const snapshot=JSON.stringify(S);
  try{
    S.sales.unshift(sale);
    sale.lines.forEach(l=>{ S.stock[l.pid]=(S.stock[l.pid]??0)-l.qty; S.movements.unshift({id:uuid(),type:"sale",pid:l.pid,qty:-l.qty,ts:now,ref:sale.ref,by:S.session.user}); });
    audit("sale.completed",`${sale.ref}, ${peso(t.payable)}, invoice ${inv}`);
    enqueue("sale.complete",id,{ref:sale.ref,invoice:inv,total:t.payable});
    S.cart={lines:[],discount:null}; S.pay=null; ui.tender=""; ui.ref=""; ui.verified=false;
    S.selSale=id; S.view="receipt";
    save();
  }catch(e){ S=JSON.parse(snapshot); toast("Sale was not saved. Nothing was charged in Kaha; try again."); return; }
  ui.cartOpen=false;
}

function viewReceipt(){
  const sale=S.sales.find(s=>s.id===S.selSale);
  if(!sale) { S.view="checkout"; return viewCheckout(); }
  const jobs=S.printJobs.filter(j=>j.saleId===sale.id);
  const last=jobs[0];
  let st;
  if(!last) st=`<div class="status info">${ICON.q}<div><b>Not printed yet</b><p>Print now, or skip if the customer doesn't need paper.</p></div></div>`;
  else if(last.status==="sent") st=`<div class="status ok">${ICON.ok}<div><b>Sent to printer</b><p>Check the paper came out. Kaha can't see the paper itself.</p></div></div>`;
  else if(last.status==="failed") st=`<div class="status danger">${ICON.alert}<div><b>Printer is out of paper</b><p>Load a new roll, then send it again. The sale is already saved; sending again won't charge twice.</p></div></div>`;
  else st=`<div class="status warn">${ICON.alert}<div><b>Printer didn't answer</b><p>Look at the printer before trying again. If a receipt came out, choose “It printed”. If you send again, it will be marked as a reprint.</p></div></div>`;
  return `<div class="receiptwrap">
    <section style="overflow:auto">${receiptHtml(sale,{reprint:false})}</section>
    <aside class="payside">
      <div class="status ok">${ICON.ok}<div><b>Sale saved</b><p class="num">${esc(sale.ref)}, ${peso(sale.totals.payable)}. ${sale.payments.some(p=>p.method==="cash"&&p.change)?`Give change: <b style="display:inline">${peso(sale.payments.filter(p=>p.method==="cash").reduce((s,p)=>s+p.change,0))}</b>`:""}</p></div></div>
      ${st}
      ${!last||last.status==="failed"?`<button class="btn primary block" data-act="print" data-v="${sale.id}">${last?"Send to printer again":"Print receipt"}</button>`:""}
      ${last&&last.status==="unknown"?`<button class="btn block" data-act="printok" data-v="${sale.id}">It printed</button><button class="btn block" data-act="reprint" data-v="${sale.id}">It didn't print, send a reprint</button>`:""}
      <div class="spacer"></div>
      <button class="charge" style="margin:0" data-act="newsale"><span>New sale</span><span class="big">＋</span></button>
    </aside>
  </div>`;
}
function doPrint(saleId, kind){
  const sale=S.sales.find(s=>s.id===saleId);
  if(kind==="reprint") sale.reprints=(sale.reprints||0)+1;
  const status = S.printerMode==="ok"?"sent":S.printerMode==="paper"?"failed":"unknown";
  S.printJobs.unshift({id:uuid(),saleId,kind,status,ts:Date.now(),printer:`Demo printer ${S.paper}`});
  sale.print=status;
  audit(kind==="reprint"?"invoice.reprinted":"invoice.print_sent",`${sale.invoice}, outcome ${status}`);
}

/* ================= SHIFT ================= */
function shiftNumbers(sh){
  const sales=S.sales.filter(s=>s.shiftId===sh.id);
  const cashSales=sales.reduce((a,s)=>a+s.payments.filter(p=>p.method==="cash").reduce((b,p)=>b+p.amount,0),0);
  const cashRefunds=S.returns.filter(r=>r.shiftId===sh.id&&r.method==="cash").reduce((a,r)=>a+r.amount,0);
  const cin=sh.moves.filter(m=>m.dir==="in").reduce((a,m)=>a+m.amount,0);
  const cout=sh.moves.filter(m=>m.dir==="out").reduce((a,m)=>a+m.amount,0);
  return {float:sh.float,cashSales,cashRefunds,cin,cout,expected:sh.float+cashSales-cashRefunds+cin-cout,count:sales.length};
}
const CMD_LABEL={"sale.complete":"Sale","shift.open":"Shift opened","shift.close":"Shift closed","cash.movement":"Cash in or out","return.create":"Return and refund","stock.receipt":"Stock received","stock.adjust":"Stock adjusted","transfer.dispatch":"Transfer sent","transfer.receive":"Transfer received"};
const DENOMS=[100000,50000,20000,10000,5000,2000,1000,500,100,25];

  const n=shiftNumbers(S.shift);
  const counted = ui.counts ? DENOMS.reduce((a,d)=>a+d*(parseInt(ui.counts[d]||"0",10)||0),0) : null;
  return `<div class="scroll"><div class="ph"><div><h1>Shift</h1><p>Opened ${tFull(S.shift.openedAt)} by ${esc(S.shift.cashier)}</p></div>
    <div style="display:flex;gap:8px"><button class="btn sm" data-act="cashmove" data-v="in">Cash in</button><button class="btn sm" data-act="cashmove" data-v="out">Cash out</button></div></div>

        <div class="r"><span>+ Cash in</span><span>${peso(n.cin)}</span></div>
        <div class="r"><span>− Cash out</span><span>${peso(n.cout)}</span></div>
        <div class="r t"><span>Expected</span><span>${peso(n.expected)}</span></div>
      </div>
      ${S.shift.moves.length?`<h2 style="margin-top:16px">Cash in and out</h2><table><tbody>${S.shift.moves.map(m=>`<tr><td>${m.dir==="in"?"In":"Out"}: ${esc(m.reason)}<br><small style="color:var(--muted)">${tTime(m.ts)}${m.approvedBy?`, approved by ${esc(m.approvedBy)}`:""}</small></td><td class="r num">${m.dir==="in"?"":"−"}${peso(m.amount)}</td></tr>`).join("")}</tbody></table>`:""}

function viewSync(){
  const pending=S.outbox.filter(c=>c.status==="pending").length;
  return `<div class="scroll"><div class="ph"><div><h1>Sync center</h1><p>Sales are saved on this device first, then sent to the store server. Nothing here is lost if the internet drops.</p></div>
    <button class="btn primary" data-act="syncnow" ${S.online&&pending?"":"disabled"}>Sync now</button></div>
  <div class="cols">
    <div class="panel"><h2>Connection</h2>
      <div class="toggle"><span><b>Online</b><small>Turn off to rehearse a dropped connection.</small></span><input type="checkbox" class="sw" data-act="online" ${S.online?"checked":""} aria-label="Online"></div>
      <div class="toggle"><span><b>Lose the next server reply</b><small>Test: the server saves the sale but the reply never arrives.</small></span><input type="checkbox" class="sw" data-act="simlost" ${S.simLostAck?"checked":""} aria-label="Simulate lost reply"></div>
      <div class="toggle"><span><b>Server rejects the next sale</b><small>Test: the sale is kept on this device and flagged for review.</small></span><input type="checkbox" class="sw" data-act="simreject" ${S.simReject?"checked":""} aria-label="Simulate rejection"></div>
    </div>
    <div class="panel"><h2>Status</h2><dl class="kv num"><dt>Waiting to send</dt><dd>${pending}</dd><dt>Needs review</dt><dd>${S.outbox.filter(c=>c.status==="quarantined").length}</dd><dt>Last catalog update</dt><dd>${tTime(S.lastPull)}</dd><dt>Server position</dt><dd>${esc(S.cursor)}</dd></dl></div>
  </div>
  <div class="panel tablewrap" style="padding:6px 8px"><h2 style="padding:8px 8px 0">Outgoing queue</h2>${S.outbox.length?`<table><thead><tr><th>#</th><th>What</th><th>Created</th><th>Tries</th><th>Status</th></tr></thead><tbody>
  ${[...S.outbox].reverse().slice(0,40).map(c=>`<tr><td class="num">${c.seq}</td><td>${esc(CMD_LABEL[c.type]||c.type)}<br><small style="color:var(--muted)" class="num">${short(c.id)}${c.note?" — "+esc(c.note):""}</small></td><td>${tTime(c.ts)}</td><td class="num">${c.attempts}</td><td>${c.status==="acked"?`<span class="tag ok">Accepted</span>`:c.status==="quarantined"?`<span class="tag danger">Needs review</span>`:`<span class="tag">Waiting</span>`}</td></tr>`).join("")}</tbody></table>`:`<div style="padding:24px;color:var(--muted)">The queue is empty. New sales, refunds, and stock changes will appear here.</div>`}</div>
  </div>`;
}
function runSync(auto){
  if(!S.online) return;
  const batch=S.outbox.filter(c=>c.status==="pending").slice(0,25);
  if(!batch.length){ if(!auto) toast("Nothing to send."); return; }
  let lost=false;
  batch.forEach(c=>{
    c.attempts++;
    if(c.serverHas){ c.status="acked"; c.note="server already had it, same result returned"; }
    else if(S.simReject && c.type==="sale.complete"){ c.status="quarantined"; c.note="server flagged a price mismatch; sale kept for review"; S.simReject=false; }
    else if(S.simLostAck && !lost){ c.serverHas=true; c.note="reply lost, will retry safely"; lost=true; }
    else { c.status="acked"; c.note=""; }
    const sale=S.sales.find(s=>s.id===c.aggregate); if(sale) sale.sync=c.status==="acked"?"acked":c.status==="quarantined"?"quarantined":"pending";
  });
  if(lost) S.simLostAck=false;
  S.lastPull=Date.now(); S.cursor="c_"+String(parseInt(S.cursor.slice(2),10)+batch.length).padStart(6,"0");
  renderKeep();
  if(lost) setTimeout(()=>runSync(true),2500);
  if(lost) toast("A reply didn't arrive. Kaha will resend; the server won't count it twice.");
  else if(!auto) toast("Sync finished.");
}

function applyDiscount(d){
  const G=compute(S.cart.lines,null).gross;
  const amount = d.type==="pct"?Math.floor((G*d.value+50)/100):d.value;
  const exceptional = amount*10>G; // more than 10%
  if(exceptional && needApproval()){
    ui.modal.pin=true; ui.modal.title="Manager approval needed"; ui.modal.lead=`A ${d.type==="pct"?d.value+"%":peso(d.value)} discount is above the 10% cashier limit.`;
    ui.modal.body=`<input type="hidden" id="dreason" value="${esc(d.reason)}">`;
    ui.modal.actions=[{label:"Cancel",fn:closeModal},{label:"Approve",cls:"primary",fn:()=>{if(!pinOk())return;S.cart.discount={...d,approvedBy:approver()};audit("discount.approved",`${peso(amount)} on cart`,{approvedBy:approver(),reason:d.reason});closeModal();}}];
    ui.pin=""; render(); return;
  }
  S.cart.discount={...d,approvedBy:exceptional?approver():null};
  audit("discount.applied",`${peso(amount)} on cart`,{reason:d.reason});
  closeModal();
}
function doReturn(s){
  const qs=s.lines.map((l,i)=>Math.max(0,parseInt(val("rq"+i)||"0",10)||0));
  if(!qs.some(Boolean)){toast("Enter at least one quantity.");return;}
  for(let i=0;i<qs.length;i++){ if(qs[i]>s.lines[i].qty-s.lines[i].returned){toast(`Only ${s.lines[i].qty-s.lines[i].returned} of ${s.lines[i].name} can still be returned.`);return;} }
  const reason=val("rr").trim(); if(!reason){toast("Add a reason for the return.");return;}
  const method=val("rm"), restock=document.getElementById("restock").checked;
  if(!pinOk()) return;
  if(method==="cash" && !S.shift){toast("Open a shift to pay a cash refund.");return;}
  let amount=0; const now=Date.now(), id=uuid();
  qs.forEach((q,i)=>{ if(!q) return; const l=s.lines[i]; const r=refundFor(l,q); amount+=r; l.returned+=q; l.refunded+=r;
    if(restock){ S.stock[l.pid]=(S.stock[l.pid]??0)+q; }
    S.movements.unshift({id:uuid(),type:"customer_return",pid:l.pid,qty:restock?q:0,ts:now,ref:"RT-"+short(id),reason:restock?"back to shelf":`${q} held as damaged, not sellable`,by:S.session.user}); });
  S.returns.unshift({id,saleId:s.id,amount,method,reason,restock,ts:now,shiftId:S.shift?.id,approvedBy:approver()});
  audit("refund.approved",`${s.ref}, ${peso(amount)} ${method==="cash"?"cash":"manual"}`,{approvedBy:approver(),reason});
  enqueue("return.create",id,{sale:s.id,amount});
  ui.modal=null; render(); toast(`Refund approved: ${peso(amount)}${method==="cash"?" from the drawer":" to be sent back outside Kaha"}.`);
}

/* ---------------- stage controls ---------------- */
const device=document.getElementById("device");
document.getElementById("frameSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;device.className="device "+b.dataset.frame;document.querySelectorAll("#frameSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));ui.cartOpen=false;render();});
document.getElementById("themeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const t=b.dataset.theme;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);document.querySelectorAll("#themeSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
if(document.documentElement.classList.contains("inapp")){ device.className="device fit"; } else if(window.innerWidth<800){ device.className="device fit"; document.querySelectorAll("#frameSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.frame==="fit")); }
render();
</script>
